name: News Fetcher Workflow

on:
  push:
    branches:
      - main
  workflow_dispatch:
  repository_dispatch:
    types: [trigger-news-fetch]

permissions:
  contents: write
  pages: write

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser python-dateutil requests urllib3 cloudscraper

      - name: Fetch Existing Live JSON
        run: |
          mkdir -p public
          curl -s -f https://androidappr.github.io/NewNepalApp/news.json -o public/news.json || true

      - name: Run Fetcher Script
        run: python fetch_news.py

      - name: Deploy static JSON to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
