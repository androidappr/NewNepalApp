name: News Fetcher Workflow

on:
  schedule:
    - cron: '*/15 * * * *'  # Runs every 15 minutes
  workflow_dispatch:        # Allows manual execution in GitHub UI
  repository_dispatch:      # Allows external triggering via Webhook API
    types: [trigger-news-fetch]

permissions:
  contents: write  # Grants workflow permission to push to gh-pages branch

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser python-dateutil requests urllib3

      - name: Run Fetcher Script
        run: python fetch_news.py

      - name: Deploy static JSON to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
