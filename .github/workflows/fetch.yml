name: News Fetcher Workflow

on:
  schedule:
    - cron: '*/15 * * * *'  # Internal fallback
  workflow_dispatch:       # Allows manual execution in GitHub UI
  repository_dispatch:     # Allows external triggering via Webhook API
    types: [trigger-news-fetch]

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser supabase python-dateutil requests urllib3

      - name: Run Fetcher Script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python fetch_news.py
